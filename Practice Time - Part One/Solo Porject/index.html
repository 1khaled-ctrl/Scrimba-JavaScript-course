<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="team">
            <h3>HOME</h3>
            <div id="home-score" class="score">0</div>
            <div class="buttons">
                <button onclick="addHome(1)">+1</button>
                <button onclick="addHome(2)">+2</button>
                <button onclick="addHome(3)">+3</button>
            </div>
        </div>

        <div class="team">
            <h3>GUEST</h3>
            <div id="guest-score" class="score">0</div>
            <div class="buttons">
                <button onclick="addGuest(1)">+1</button>
                <button onclick="addGuest(2)">+2</button>
                <button onclick="addGuest(3)">+3</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
